<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukuva — Hero Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  .ab-frame { width: 100%; height: 100%; border: 0; display: block; background: #FCFAF6; }
  .ab-note { font-family: 'Schibsted Grotesk', sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { createRoot } = ReactDOM;
const W = 1320, H = 820;
function Hero({ src }) {
  return <iframe className="ab-frame" src={src} scrolling="no" title={src}></iframe>;
}
function App() {
  return (
    <DesignCanvas>
      <DCSection id="heroes" title="Ukuva — Hero directions" subtitle="Three treatments of the same promise. Same palette, type system and nav. Pick one to take forward — or mix.">
        <DCArtboard id="hero-a" label="A · Editorial statement" width={W} height={H}>
          <Hero src="heroes/hero-a.html" />
        </DCArtboard>
        <DCArtboard id="hero-b" label="B · Split / portrait" width={W} height={H}>
          <Hero src="heroes/hero-b.html" />
        </DCArtboard>
        <DCArtboard id="hero-c" label="C · Concept / isiXhosa (dark)" width={W} height={H}>
          <Hero src="heroes/hero-c.html" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
